name: Gitea Actions Demo
run-name: ${{ gitea.actor }} is testing out Gitea Actions 🚀
on: [push]

jobs:
  Explore-Gitea-Actions:
    runs-on: native
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ gitea.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by Gitea!"
      - run: echo "🔎 The name of your branch is ${{ gitea.ref }} and your repository is ${{ gitea.repository }}."
      - name: Check out repository code
        uses: actions/checkout@v4
      - run: echo "💡 The ${{ gitea.repository }} repository has been cloned to the runner."
      - name: Show Go version
        run: go version
      - name: Download dependencies
        run: go mod download
      - name: Build
        run: go build -o radius-api ./cmd/api
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: List files in the repository
        run: |
          ls ${{ gitea.workspace }}
      - name: Deploy
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: ${{ secrets.DB_SSLMODE }}
        run: |
          sudo cp radius-api /opt/radius-api/radius-api
          sudo chown radius-api:radius-api /opt/radius-api/radius-api
          sudo tee /etc/radius-api.env > /dev/null << EOF
          DB_HOST=$DB_HOST
          DB_PORT=$DB_PORT
          DB_NAME=$DB_NAME
          DB_USER=$DB_USER
          DB_PASSWORD=$DB_PASSWORD
          DB_SSLMODE=$DB_SSLMODE
          EOF

          sudo chmod 600 /etc/radius-api.env
          sudo chown radius-api:radius-api /etc/radius-api.env 
          sudo systemctl restart radius-api
      - run: echo "🍏 This job's status is ${{ job.status }}."
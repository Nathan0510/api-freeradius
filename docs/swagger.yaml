basePath: /
definitions:
  models.Nas:
    properties:
      community:
        type: string
      description:
        type: string
      id:
        type: integer
      nasname:
        type: string
      ports:
        type: integer
      secret:
        type: string
      server:
        type: string
      shortname:
        type: string
      type:
        type: string
    type: object
info:
  contact: {}
  description: API Freeradius pour la gestion des utilisateurs et des NAS
  title: Radius API
  version: "1.0"
paths:
  /nas:
    get:
      consumes:
      - application/json
      description: Récupère la liste complète de tous les NAS configurés
      produces:
      - application/json
      responses:
        "200":
          description: Liste des NAS récupérée avec succès
          schema:
            items:
              $ref: '#/definitions/models.Nas'
            type: array
        "500":
          description: Erreur serveur interne
          schema:
            additionalProperties: true
            type: object
      summary: Récupérer tous les NAS Radius
      tags:
      - NAS
  /nas/{username}:
    delete:
      description: Supprime un NAS existant à partir du nom d'utilisateur fourni
      parameters:
      - description: Nom d'utilisateur du NAS
        in: path
        name: username
        required: true
        type: string
      responses:
        "200":
          description: Message de succès"  example(map[string]string{"message":"Nas
            deleted successfully"})
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Message d'erreur
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Supprime un NAS
      tags:
      - NAS
    get:
      consumes:
      - application/json
      description: Afficher la configuration d'un NAS
      produces:
      - application/json
      responses:
        "200":
          description: NAS récupérée avec succès
          schema:
            items:
              $ref: '#/definitions/models.Nas'
            type: array
        "500":
          description: Erreur serveur interne
          schema:
            additionalProperties: true
            type: object
      summary: Afficher un NAS
      tags:
      - NAS
swagger: "2.0"
